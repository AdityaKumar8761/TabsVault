<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TabsVault</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <main class="app">

        <!-- =========================
             HEADER
        ========================== -->

        <header class="header">

            <div class="brand">

                <img src="logo.png" alt="TabVolt">

                <span>TabVault</span>

            </div>


            <div class="header-actions">


                <button class="icon-btn delete-btn" title="Delete All">
                    🗑
                </button>

            </div>

        </header>


        <!-- =========================
             QUICK ACTIONS
        ========================== -->

        <section class="quick-actions">

            <button class="action-btn-1">

                <span>Save Tab</span>

            </button>


            <button class="action-btn-2">

                <span class="action-icon">↗</span>

                <span>Add URL</span>

            </button>

        </section>


        <input class="note-input-el" type="text">


        <!-- =========================
             TABS / GROUPS NAVIGATION
        ========================== -->

        <nav class="navigation">

            <button
                class="nav-btn active"
                id="tabsBtn">

                Tabs

            </button>


            <button
                class="nav-btn"
                id="groupsBtn">

                Groups

            </button>

        </nav>


        <!-- =========================
             SLIDING CONTENT WINDOW
        ========================== -->

        <div class="content-window">

            <div
                class="content-slider"
                id="contentSlider">


                <!-- =================================
                     TABS PANEL
                ================================== -->

                <section class="content-panel">


                    <!-- SAVED TABS -->

                    <section class="tabs-list">

                        <!-- Tabs will be generated by index.js -->

                    </section>

                </section>


                <!-- =================================
                     GROUPS PANEL
                ================================== -->

                <section class="content-panel groups-panel">

                    <section class="groups-list">

                        <!-- Groups will be generated by index.js -->

                    </section>

                </section>

            </div>

        </div>


        <!-- =========================
             CREATE GROUP
        ========================== -->

        <button class="add-group-btn">

            <span>＋</span>

            Create Group

        </button>



    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="index.js"></script>
    <script src="action.js"></script>

</body>

</html>
